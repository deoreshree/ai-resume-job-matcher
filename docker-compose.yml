version: '3.8'

services:
  app:
    build: .
    container_name: ai-resume-matcher
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENABLE_EMBEDDINGS=${ENABLE_EMBEDDINGS:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - ./data:/app/data:ro
    networks:
      - resume-network

networks:
  resume-network:
    driver: bridge